<!doctype html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Personal Hub{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="{% block body_class %}{% endblock %}">
<nav class="navbar navbar-expand-lg hub-nav sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
            <span class="hub-mark"><i class="bi bi-grid-fill"></i></span>
            <span>Personal Hub</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path.startswith('/loja') %}active{% endif %}" href="/loja">
                        <i class="bi bi-bag me-1"></i>Loja
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <span class="hub-pill d-none d-md-inline">127.0.0.1:7777</span>
                <button id="btn-limpar-agora" class="btn btn-sm btn-limpar" title="Remove todos os arquivos e conversas">
                    <i class="bi bi-trash3"></i> <span id="btn-limpar-label">Limpar Tudo</span>
                </button>
            </div>
        </div>
    </div>
</nav>

<main class="container hub-main">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
