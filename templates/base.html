<!doctype html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Personal Hub{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
<nav class="navbar navbar-expand-lg hub-nav sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
            <span class="hub-mark"><i class="bi bi-grid-fill"></i></span>
            <span>Personal Hub</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                <li class="nav-item">
                    <a class="nav-link {% if request.url.path.startswith('/loja') %}active{% endif %}" href="/loja">
                        <i class="bi bi-bag me-1"></i>Loja
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <span class="hub-pill d-none d-md-inline" title="Modo {{ hub_mode }}">{{ hub_bind_label }}</span>
                <button type="button" id="btn-limpar-temporarios" class="btn btn-sm btn-outline-secondary" title="Apaga uploads de video, imagem, screenshot e PDF">
                    <i class="bi bi-trash3"></i> <span class="d-none d-lg-inline btn-limpar-temp-label">Limpar arquivos temporarios</span>
                </button>
                <button type="button" id="btn-destruir-tudo" class="btn btn-sm btn-destruir" title="Apaga todos os dados do hub">
                    <i class="bi bi-exclamation-octagon"></i> <span class="d-none d-sm-inline">Destruir tudo</span>
                </button>
                {% if hub_auth_required and request.state.hub_authenticated %}
                <form method="post" action="/logout" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-secondary" title="Sair">
                        <i class="bi bi-box-arrow-right"></i> <span class="d-none d-sm-inline">Sair</span>
                    </button>
                </form>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

<main class="container hub-main">
    {% block content %}{% endblock %}
</main>

<footer class="hub-footer">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2 py-3">
        <span class="hub-footer__copy">Personal Hub</span>
        <a class="hub-footer__link" href="https://github.com/renangf4/personal-hub" target="_blank" rel="noopener noreferrer">
            <i class="bi bi-github me-1"></i>renangf4/personal-hub
        </a>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
