<!doctype html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar — Personal Hub</title>
    <link rel="icon" type="image/svg+xml" href="{{ static_url('favicon.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ static_url('css/style.css') }}" rel="stylesheet">
</head>
<body>
<main class="container hub-main" style="max-width: 28rem; padding-top: 4rem;">
    <div class="text-center mb-4">
        <span class="hub-mark d-inline-flex"><i class="bi bi-grid-fill"></i></span>
        <h1 class="hub-title h3 mt-3 mb-1">Personal Hub</h1>
        <p class="hub-subtitle mb-0">Modo LAN — informe a senha compartilhada</p>
    </div>

    <div class="card hub-card">
        <div class="card-body p-4">
            {% if erro %}
            <div class="alert alert-danger small">{{ erro }}</div>
            {% endif %}
            <form method="post" action="/login" autocomplete="current-password">
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label class="form-label" for="senha">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-unlock me-1"></i> Entrar
                </button>
            </form>
            <p class="text-secondary small mt-3 mb-0">
                Definida em <code>HUB_PASSWORD</code> no servidor. Nao exponha o hub na internet.
            </p>
        </div>
    </div>
</main>
</body>
</html>
